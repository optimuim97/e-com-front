# ══════════════════════════════════════════════════════════════════════
# Rosa Beauty — Nginx
# SPA Vue + API Laravel (FastCGI) + WebSocket Reverb
#
# Caddy assure TLS et les en-têtes de sécurité en amont ; ce serveur ne
# répond qu'en HTTP sur le réseau Docker interne.
# ══════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker attribue une nouvelle IP à chaque recréation de container.
# nginx ne résout les noms d'hôte qu'une fois, au démarrage : après un
# déploiement du backend seul, il continuait de joindre l'ancienne adresse
# et répondait 502 jusqu'à un redémarrage manuel.
# Passer par le resolver Docker + une variable force une résolution à
# l'exécution, ce qui rend nginx insensible aux recréations.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    charset utf-8;

    set $laravel_upstream laravel:9000;
    set $reverb_upstream  reverb:8080;

    client_max_body_size 25M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Uploads Laravel — servis directement, sans passer par PHP ─────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── WebSocket Reverb ──────────────────────────────────────────────
    location /app/ {
        proxy_pass         http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API Laravel + Sanctum + Broadcasting ──────────────────────────
    location ~ ^/(api|sanctum|broadcasting)/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   $laravel_upstream;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param  PATH_INFO       $fastcgi_path_info;
            fastcgi_read_timeout 120s;
            include        fastcgi_params;
        }
    }

    # ── Point de santé Laravel + fichiers racine du backend ───────────
    # robots.txt et sitemap.xml sont générés par Laravel : ils dépendent du
    # catalogue et de l'environnement (la recette se bloque elle-même).
    location ~ ^/(up|index\.php|robots\.txt|sitemap\.xml|favicon\.ico)$ {
        root /var/www/html/public;
        fastcgi_pass   $laravel_upstream;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        include        fastcgi_params;
    }

    # ── Pages référencées : coquille rendue par Laravel ────────────────
    # Le front pose ses balises SEO en JavaScript, après le montage de Vue.
    # Les robots de WhatsApp et de Facebook n'en exécutent jamais, et Google
    # ne le fait qu'en seconde passe : sans ce détour, les 34 URL du sitemap
    # renvoient toutes le titre et la description de la page d'accueil.
    #
    # Seuls ces chemins passent par PHP. Le tunnel d'achat, l'espace client
    # et l'administration restent servis en statique — ils sont exclus de
    # l'indexation par robots.txt, ils n'ont rien à y gagner, et le site
    # continue de s'afficher si PHP tombe.
    #
    # Une expression régulière l'emporte sur le préfixe « / » quel que soit
    # l'ordre d'écriture ; elle est placée ici pour la lisibilité.
    #
    # `[^/.]` exclut tout segment contenant un point : public/ du front
    # contient bien un dossier products/ et un dossier blog/ remplis d'images
    # (/products/eau_de_rose_classique.jpg est affiché sur l'accueil). Sans
    # cette précaution, ces fichiers partiraient vers PHP, qui répondrait la
    # coquille HTML à la place de l'image.
    location ~ ^/$|^/(products|gammes|blog)(/[^/.]*)?/?$|^/(a-propos|contact|programme)/?$ {
        fastcgi_pass   $laravel_upstream;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 30s;
        include        fastcgi_params;
    }

    # ── SPA Vue — tout le reste ───────────────────────────────────────
    root  /var/www/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;

        # ⚠ Doit rester AVANT la règle des assets : nginx retient la PREMIÈRE
        # expression régulière qui matche. Le service worker porte l'extension
        # .js ; s'il héritait de « immutable, 1 an », un correctif ne serait
        # jamais repris et les visiteurs resteraient bloqués sur l'ancienne
        # version pendant des mois.
        location ~* ^/(sw\.js|manifest\.webmanifest|offline\.html)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Assets Vite : nom haché → cache immuable
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|mp4|mov)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    server_tokens off;
}
